egoe UI, Arial, sans-serif" fill="#edf7fa" font-weight="600">Set Wi-Fi</text><text x="394" y="216" font-size="11" font-family="Segoe UI, Arial, sans-serif" fill="#a6bbc6">Edit wifi-config.json</text><path d="M540 177h8m-4-4 4 4-4 4" fill="none" stroke="#55dbc0" stroke-width="2" /><rect x="553" y="111" width="156" height="145" rx="16" fill="#152a36" stroke="#31505e" /><circle cx="581" cy="141" r="17" fill="#55dbc0" /><text x="581" y="147" text-anchor="middle" fill="#0a2921" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="18">4</text><text x="567" y="186" font-size="16" font-family="Segoe UI, Arial, sans-serif" fill="#edf7fa" font-weight="600">Build &amp; flash</text><text x="567" y="216" font-size="11" font-family="Segoe UI, Arial, sans-serif" fill="#a6bbc6">Connect Pico by USB</text><path d="M713 177h8m-4-4 4 4-4 4" fill="none" stroke="#55dbc0" stroke-width="2" /><rect x="726" y="111" width="156" height="145" rx="16" fill="#152a36" stroke="#31505e" /><circle cx="754" cy="141" r="17" fill="#55dbc0" /><text x="754" y="147" text-anchor="middle" fill="#0a2921" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="18">5</text><text x="740" y="186" font-size="16" font-family="Segoe UI, Arial, sans-serif" fill="#edf7fa" font-weight="600">Find the IP</text><text x="740" y="216" font-size="11" font-family="Segoe UI, Arial, sans-serif" fill="#a6bbc6">Read the USB status</text><path d="M886 177h8m-4-4 4 4-4 4" fill="none" stroke="#55dbc0" stroke-width="2" /><rect x="899" y="111" width="156" height="145" rx="16" fill="#152a36" stroke="#31505e" /><circle cx="927" cy="141" r="17" fill="#55dbc0" /><text x="927" y="147" text-anchor="middle" fill="#0a2921" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="18">6</text><text x="913" y="186" font-size="16" font-family="Segoe UI, Arial, sans-serif" fill="#edf7fa" font-weight="600">Open &amp; drive</text><text x="913" y="216" font-size="11" font-family="Segoe UI, Arial, sans-serif" fill="#a6bbc6">Phone on the same LAN</text><text x="34" y="297" font-family="Segoe UI, Arial, sans-serif" fill="#a6bbc6" font-size="14">First test: wheels lifted → low speed → release to stop → STOP &amp; DISARM</text></svg>